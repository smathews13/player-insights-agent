# Generated by scripts/bundle-server.mjs from app.yaml. Edit that file, not this one.
command: ['node', 'server.mjs']
env:
  # Bundle target that produced this app. Empty in source so a Git-based deploy
  # leaks no internal target name; bundle/app-release.sh fills it in the generated
  # deploy tree. Release requests need it so the notebook can execute the exact
  # approved target without asking the customer to edit bundle configuration.
  - name: PLAYER_INSIGHTS_TARGET
    value: ''
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
  - name: DATABRICKS_SERVING_ENDPOINT_NAME
    valueFrom: serving-endpoint
  # App-only Ed25519 private key used to sign short-lived administrator
  # capabilities. The value comes from a Databricks secret resource and is
  # never copied into build output, request logs, responses, or Model Serving.
  - name: PLAYER_INSIGHTS_GENIE_MCP_PRIVATE_KEY
    valueFrom: genie-mcp-signing-key
  # Foundation model baked into the served agent. Empty in public source;
  # bundle/app-release.sh fills the target value so Connections can still name
  # it when the app principal cannot read the registered model artifact.
  - name: PLAYER_INSIGHTS_LLM_ENDPOINT
    value: ''
  # The warehouse the access gate probes as the signed-in user. This is the app's
  # own warehouse, not the served agent's, which takes its warehouse from the
  # model artifact. The two can differ, so a gate verdict covers the warehouse
  # named here and says nothing about the one an answer ran on. Unset, the gate
  # reports that it could not check rather than that access was refused.
  - name: DATABRICKS_SQL_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # Active Vector Search identity copied from the bundle release. These are
  # app-side evidence only: changing them does not change or re-log the model.
  # Empty is the neutral public default for deployments without semantic search.
  - name: PLAYER_INSIGHTS_SEMANTIC_INDEX
    value: ''
  - name: PLAYER_INSIGHTS_SEMANTIC_ENDPOINT
    value: ''
  # Bundle-owned semantic rebuild job. Empty for deployments that do not create
  # one; bundle/app-release.sh fills the resolved job id when present so Ops can
  # join JOBS billing rows to this deployment without guessing by name.
  - name: PLAYER_INSIGHTS_INDEX_REBUILD_JOB_ID
    value: ''
  # The experiment the serving endpoint traces into, which lets Run Explorer
  # deep-link a stored MLflow trace id. Supplied two ways, and the app prefers the
  # more specific: a numeric id here wins; empty (the authored default) falls
  # through to the PATH below.
  #
  # LEAVE THE ID EMPTY HERE. It is a per-workspace numeric id, so a literal ships
  # one workspace's experiment into every build and a customer following the link
  # lands on an experiment that does not exist in their account.
  # bundle/app-release.sh still resolves and fills it for a bundle release; a
  # "From Git" deploy leaves it empty and relies on the PATH.
  - name: PLAYER_INSIGHTS_EXPERIMENT_ID
    value: ''
  # The workspace PATH of that experiment, which the app resolves to an id at
  # runtime -- as its own service principal, the same MLflow get-by-name
  # bundle/app-release.sh runs at release time -- WHENEVER the id above is empty.
  # This is what makes a "From Git" deploy, which never runs the release, get the
  # deep link too.
  #
  # SAFE TO BAKE IN, UNLIKE THE ID. A workspace path is the same string in every
  # workspace, and this is the bundle's own default (var.experiment_path). A
  # bundle release still sets the id above, which takes precedence, so a target
  # tracing into a different path is unaffected. Empty here and empty above means
  # no link, which the app reports as unset.
  - name: PLAYER_INSIGHTS_EXPERIMENT_PATH
    value: '/Shared/player-insights-agent'
  - name: PLAYER_INSIGHTS_BUILD_SHA
    value: '4ac0ca0ab84229dbdeb23a5258422a238c5a5d13'
  # Postgres schema the app creates and owns inside Lakebase. Safe to bake the
  # default: it is the same string in every workspace (`player_insights`), and
  # matches var.lakebase_app_schema. bundle/app-release.sh overrides it from the
  # bundle var when a target changes it. Connections reads this env so the row
  # shows the live schema, never "not set". Changing it on a live install still
  # needs a grant + data migration; the env alone does not move existing tables.
  - name: PLAYER_INSIGHTS_APP_SCHEMA
    value: 'player_insights'
  # Application-controlled inactivity limit for protected API routes. The
  # default is 120 minutes (2 hours); whole numbers are clamped to 5-480. Only
  # the literal value "disabled" turns this compensating control off. This does
  # not alter the separate Databricks workspace or identity-provider session.
  - name: PLAYER_INSIGHTS_IDLE_TIMEOUT_MINUTES
    value: '120'
  # Catalog and schema this release's data contract lives in. Empty in source so
  # a Git deploy ships no customer Unity Catalog names. bundle/app-release.sh
  # fills them from var.app_catalog / var.app_schema. Connections qualifies the
  # committed table list with these and asks Unity Catalog whether the signed-in
  # user can reach them. Empty means warehouse-only verification, said plainly.
  - name: PLAYER_INSIGHTS_CATALOG
    value: ''
  - name: PLAYER_INSIGHTS_SCHEMA
    value: ''
  # Genie space ids this release adopted. Same rule as catalog: empty in source,
  # filled at app-release from the bundle variables the agent log already uses.
  - name: PLAYER_INSIGHTS_DATA_GENIE_ID
    value: ''
  - name: PLAYER_INSIGHTS_DICTIONARY_GENIE_ID
    value: ''
  # The model that scores benchmark answers. Never on the answer path.
  # bundle/app-release.sh resolves it from var.judge_endpoint. Safe to leave
  # empty, because a value saved on the settings page overrides it per request.
  - name: PLAYER_INSIGHTS_JUDGE_ENDPOINT
    value: ''
  # The three-part Unity Catalog name a notebook publishes its declaration to, so
  # the Connections tab can show where the notebook and the running model disagree.
  # Empty on purpose: it is a per-workspace name, and a value saved on the settings
  # page overrides it. Read as the SIGNED-IN USER on the `sql` scope, so a reader
  # without SELECT on it is told that rather than shown somebody else's answer.
  # Nothing published to it is applied to the running agent.
  - name: PLAYER_INSIGHTS_NOTEBOOK_DECLARATION
    value: ''
  # Whether the conversation rail lists everyone's conversations or only the
  # signed-in user's. Per-user scoping is the default and the safe setting.
  # Turning this on is for a shared evaluation workspace where stakeholders
  # benchmark together and attribution is the point.
  #
  # The app fails closed: only the exact value "true" enables sharing, so unset,
  # empty, "1", "yes" and a typo all leave the rail scoped per user, and the app
  # logs which it saw at boot. Writes are never widened; delete, ask and upload
  # stay owner-only whatever this says. bundle/app-release.sh resolves it from
  # var.shared_conversation_rail, so set it in the bundle rather than here.
  - name: PLAYER_INSIGHTS_SHARED_CONVERSATION_RAIL
    value: 'false'
  # The deployment's admin access group. Its members hold at least the Player
  # Insights Agent Admin role, and Identity shows it as deployment-managed rather
  # than editable. Super admin stays an explicit roster role.
  #
  # Acme's exact workspace group, authored here so a plain Deploy from Git
  # carries it with nothing run afterwards. Keep its case: SCIM names are exact.
  # bundle/app-release.sh replaces it from var.app_admin_group when a target sets
  # one, and the release-environment snapshot keeps that across later Git deploys.
  - name: PLAYER_INSIGHTS_ADMIN_GROUP
    value: 'S_TK2_Databricks_globalmartech_PIA_Admin'
  # The other access groups, comma separated. Their members sign in as Consumers;
  # Identity lists them as set by this deployment. Individual users are never
  # replaced by any group here.
  - name: PLAYER_INSIGHTS_CONSUMER_GROUPS
    value: 'S_TK2_Databricks_globalmartech_PIA_Engineer,S_TK2_Databricks_globalmartech_PIA_Exec'
  # Super admins pinned by this deployment. Unlike the bootstrap list below, this
  # applies on every boot and to an existing roster, so a plain Deploy from Git
  # gives the named people full access with nothing run afterwards. They cannot
  # be removed or demoted from the Identity screen. Comma separated addresses.
  - name: PLAYER_INSIGHTS_SUPER_ADMINS
    value: 'garrecht.metzger@take2games.com'
  # Greenfield role bootstrap: a comma-separated list of email addresses.
  # The app writes these roles to Lakebase only when the roster is genuinely
  # empty. Once any role row exists, this value is ignored forever: absence or a
  # stale value on a later code deploy cannot add, remove, promote or demote
  # anybody. Lakebase is the runtime source of truth.
  #
  # EMPTY ON A GENUINELY EMPTY ROSTER MEANS NOBODY, NOT EVERYBODY. The app
  # refuses every administrative surface until an operator explicitly creates a
  # role row. Empty after bootstrap is harmless because the stored roster wins.
  #
  # NO VALUE HERE, EVER. An address in this file is one workspace's employee
  # shipped into every build, and this tree is published. bundle/app-release.sh
  # takes it from `var.admin_emails`, which databricks.yml declares and leaves
  # empty, and which a deployment fills in the git-ignored
  # .databricks/bundle/<target>/variable-overrides.json.
  #
  # THE GENERATED build/deploy/app.yaml IS THE ONE PLACE THE ADDRESSES LAND, and
  # that file is tracked and published. The release uploads it from the local
  # build tree, so it never needs committing; do not commit it after a release
  # that set this. The build prints the same warning and the leak check blocks
  # on it.
  - name: PLAYER_INSIGHTS_ADMIN_EMAILS
    value: ''
  # Optional deployment-private organization labels for the Identity roster.
  # JSON only; customer domains belong in a pruned target overlay or an
  # untracked deployment override, never in this published file.
  - name: PLAYER_INSIGHTS_ORGANIZATIONS
    value: ''
  # Optional deployment-private Slack destinations for account actions. Every
  # value stays empty in authored and committed builds. A release may inject a
  # validated direct profile or exact-name search URL plus bounded plain-text
  # labels. Feedback is for the app maintainers; escalation is a distinct
  # customer Super Admin route and never appears inside the feedback submenu.
  - name: PLAYER_INSIGHTS_FEEDBACK_SLACK_URL
    value: ''
  - name: PLAYER_INSIGHTS_FEEDBACK_SLACK_LABEL
    value: ''
  - name: PLAYER_INSIGHTS_ESCALATION_SLACK_URL
    value: ''
  - name: PLAYER_INSIGHTS_ESCALATION_SLACK_LABEL
    value: ''
  # Optional deployment override for example SP profiles. Empty uses the
  # customer-neutral defaults compiled into the server. A validated array or
  # explicit replace/extend object may be supplied by a private target.
  - name: PLAYER_INSIGHTS_PERSONA_TEMPLATES
    value: ''
  # The catalog and schema Databricks Apps writes this app's own telemetry into,
  # as `catalog.schema`. Read by the Ops tab, which reports what the app served,
  # and by the administrator settings, which grant an admin read access to it at
  # the moment they are made an admin.
  #
  # EMPTY IS THE NORMAL CASE FOR A CUSTOMER TARGET and means telemetry is off.
  # App telemetry ingestion is billed, so a customer target opts into no charge
  # and sets no destination. Both readers treat empty as "not configured" and say
  # so, rather than guessing at a schema somebody else owns.
  #
  # bundle/app-release.sh builds it from var.catalog and var.app_telemetry_schema
  # for the target being released, so the two exist once, in the bundle.
  - name: PLAYER_INSIGHTS_TELEMETRY_SCHEMA
    value: ''
  # The user API scopes this deployment declares, comma-separated. The app
  # compares a forwarded token's own scope list against these and tells a reader
  # whose sign-in predates a declaration what to do, instead of leaving them with
  # red rows and a 403.
  #
  # THE ASK-PATH SCOPES, WORKSPACE BROWSE, AND LAKEBASE ARE THE AUTHORED FALLBACK. A plain build is the
  # artifact customers deploy from Git, and that path has no bundle target from
  # which to resolve this value. Leaving it empty made a normal Git deployment
  # claim it needed no serving, SQL, or Genie scope at all. The ask-path scopes
  # are not target-specific: every Player Insights Agent question needs them. Workspace read
  # and Lakebase are also requested so the Connections notebook and Lakebase
  # pickers can work after a Git deploy, but remain optional to the gate. Other
  # optional browse scopes stay out of this fallback.
  #
  # bundle/app-release.sh still replaces this value with the exact resolved
  # `user_api_scopes` from the App resource for a bundle target. That is how a
  # target which opts into catalog, Vector Search, or Postgres browse
  # reports the larger list without making any optional scope universally
  # required here.
  #
  # No counts here on purpose. This comment gave three of them -- the default's
  # length, the demo target's, and the difference -- and two had gone stale by
  # 2026-08-17, because the Vector Search pair took the demo target to nine and
  # nothing recomputes a sentence. Every number in it was maintained by hand and
  # derivable from the bundle, which is the wrong side of that trade. The
  # authority is `bundle summary -t <target>`, and the app reports the resolved
  # list on its own Connections page.
  #
  - name: PLAYER_INSIGHTS_USER_API_SCOPES
    value: 'serving.serving-endpoints,model-serving,sql,dashboards.genie,workspace.workspace:read,postgres'
  # Boot-time check that a user-authorization model is not answering as the app
  # service principal. Empty means enforce in production and skip in development
  # and tests. Set "false" to disable the serving probe; set "true" to require it
  # outside production too.
  - name: ENFORCE_IDENTITY_READINESS
    value: ''
  # Whether the logged model requires signed-in-user execution. Empty or any
  # truthy value means user-authorization. Only an explicit falsey value treats
  # the model as service-principal-only and skips the OBO probe.
  - name: PLAYER_INSIGHTS_USER_AUTHORIZATION
    value: ''
  - name: NODE_ENV
    value: production
  - name: PLAYER_INSIGHTS_BUILD_ANCESTORS
    value: '4ac0ca0ab84229dbdeb23a5258422a238c5a5d13,fecc46c0bf5805f1772ed3fae13e138c6cc49653,c0705dec4823eaedffbb3542df4500a1266d31a8,2bd7d498c9537c5463ce988f5ae9a5562175f939,3d62e2e3a159dd08d47df25a4a5fd59cc0ede777,b43e7c780320339c3ce9183c5d4a166dc40efe18,d5f979f184e6a429dbdc0a3b9cb91cbec7d3d962,093f8fd7d5c83ba0b828799b7edcdba991c79d19,390e54fdaf31631a68b3ef0c16fed5127ecd72e2,9e529de6459acf6e13ae7153b3dda842d941e347,2554a7234c93a7861a007fee6edfdcddeca61ee7,8725baf8beb7f9e4643f040c4abd85a1966d14e1,389908766e689cef4abfb2aa0686f2b4123d946f,286240cf694bb3e0fba9caedac2fc740c655892b,14a58c3233b21ca9aa96b373efe29ad61ebf8dc8,ccc996962a12fac03351adae6b2a3181bb3a4bcc,5d1648c6f787e29a452af725e9af830ba5a6b185,9c63e0f4460f3a57c067aaae9d48c535523878fa,d589f006263b4007bb0ea97ffc99ee611c454f4c,89cddcd75aaec04bb6fa20b842cc8fd707e4b38a,788f98d0425bc71b6269b17bdffc701951064015,d3bd9f974b3c71c0d1184394f3cf842cd7c5aa7b,18c292614c7a7b9f7d7e055a757bfc46c485a15b,a4711a9178a7e6df01bcae8cceba8fdfd98678a3,90331a3e1b65c1284f422fa107ad2eb32594da6e,c85650cbed7379a564e599ae1e3bc56811a2599e,538050747caf7a4f0618c77dfffcfd1cfa179f2c,bb2338efeebf11f6a078716927c0c46c314c614b,a172fd69d3367f528ca57022fac564a8ef412458,1260d2cffe60464bfe4fb4e3f219af2e9aad5460,3f0db12e7548a1b9e979f952f9cd6b211e72d2d8,973bf462deb27fd35c1dd3232ce7c8e87c89b10b,ab545f725ab0794f9e1a6118c09a371dbc414a16,3cbb22b40563059fb8251a4879e6400ab28ec40d,2372f27a6b6629f14ad4e804f6fc8d8610c3b78b,2ab0239ce11a02a5ec0216ed31db3c21cf92f563,efe5644d4da33a110f565b68db0bd84d192c45c4,6151dcae65f44e52bbb7ba643d1e07d34bed6bae,b28a7b303e959496af7323d93437fe24a2b3d392,edb4414fbee3d125a5357c91aa840966fcb6b24f,8b2dd89b47fdce1c74392fdb7b909c7846e41431,cb6510c7bd736c43bc10f2e2d19bcb70d9ecc0ab,0b8bdf9ae0b3f94878049366feec0869862a8c8a,46df657c7d706c28c19f503e01f530952dd3e294,100f4f3f50190bc8996e62dee94e2f99a70a6287,7ee2dcd55c807af2489d297db58cef1e9ae3efbc,3bc4c85a1ea2e44d4385fd34cea40b6c4c5461d3,6a23d81a9f14a5327f933a10595a5ab4d3502a9b,62707db532eb87b53301