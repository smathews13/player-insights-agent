<!doctype html>
<html
  lang="en"
  class="light"
  data-theme="dark"
  data-background-graphics="on"
  data-animations="on"
  data-density="comfortable"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11171C" />
    <script>
      /*
       * Server settings remain canonical. This same-origin cache only lets the
       * root adopt the last successful Appearance read before CSS paints.
       */
      try {
        const saved = JSON.parse(localStorage.getItem('astrolabe.runtime-appearance.v1') || 'null');
        if (saved && typeof saved === 'object') {
          const root = document.documentElement;
          if (saved.colorScheme === 'dark' || saved.colorScheme === 'light') {
            root.dataset.theme = saved.colorScheme;
            document
              .querySelector('meta[name="theme-color"]')
              ?.setAttribute('content', saved.colorScheme === 'dark' ? '#11171C' : '#ffffff');
          }
          root.dataset.backgroundGraphics = saved.backgroundGraphics === false ? 'off' : 'on';
          root.dataset.animations = saved.animations === false ? 'off' : 'on';
          root.dataset.density = saved.density === 'compact' ? 'compact' : 'comfortable';
          const hex = /^#[0-9a-f]{6}$/i;
          if (hex.test(saved.fontBodyColor)) {
            for (const token of [
              '--ast-text',
              '--ast-text-long',
              '--foreground',
              '--card-foreground',
              '--popover-foreground',
              '--secondary-foreground',
              '--accent-foreground',
              '--db-ink',
              '--db-body',
            ]) {
              root.style.setProperty(token, saved.fontBodyColor);
            }
          }
          if (hex.test(saved.fontMutedColor)) {
            for (const token of ['--ast-text-secondary', '--ast-caption', '--muted-foreground', '--db-slate']) {
              root.style.setProperty(token, saved.fontMutedColor);
            }
          }
          const families = {
            'dm-sans': "'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif",
            system: "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif",
            'dm-mono': "'DM Mono', ui-monospace, SFMono-Regular, Menlo, monospace",
          };
          if (families[saved.fontFamily]) root.style.setProperty('--font-sans', families[saved.fontFamily]);
          const sizeScale = { s: 0.92, m: 1, l: 1.15 }[saved.fontSize];
          if (sizeScale) {
            for (const [token, px] of [
              ['--text-xs', 11],
              ['--text-sm', 12],
              ['--text-base', 13],
              ['--text-h-sub', 14],
              ['--text-h-section', 16],
              ['--text-h-card', 18],
              ['--text-h-page', 22],
              ['--text-kpi', 22],
              ['--text-hero', 32],
              ['--ast-fs-11', 11],
              ['--ast-fs-12', 12],
              ['--ast-fs-13', 13],
              ['--ast-fs-14', 14],
              ['--ast-fs-16', 16],
              ['--ast-fs-18', 18],
              ['--ast-fs-22', 22],
              ['--ast-fs-32', 32],
            ]) {
              root.style.setProperty(token, `${Math.round(px * sizeScale)}px`);
            }
          }
          for (const kind of ['catalog', 'schema', 'table', 'column', 'quote', 'tag']) {
            const style = saved.entityStyles?.[kind];
            if (hex.test(style?.foreground)) root.style.setProperty(`--entity-${kind}-fg`, style.foreground);
            if (hex.test(style?.background)) root.style.setProperty(`--entity-${kind}-bg`, style.background);
          }
        }
      } catch {
        // Defaults above are the safe first paint when storage is unavailable.
      }
    </script>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }
      body {
        margin: 0;
        background: #ffffff;
      }
      html[data-theme='dark'] body {
        background: #11171c;
      }
    </style>
    <link rel="icon" type="image/png" sizes="16x16" href="/pia-dpad-tab-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/pia-dpad-tab-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/pia-dpad-tab-48x48.png" />
    <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="/pia-dpad-apple-touch-180x180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--
      The body typeface, asked for before the stylesheet that names it has arrived.

      A font is otherwise the LAST thing discovered on a cold load: the browser has to
      fetch the entry script, then the stylesheet it imports, then parse the @font-face
      in styles/fonts.css, and only then does it learn this file exists. Starting it here
      collapses that chain, which is worth more than it looks -- fonts.css sets
      `font-display: swap` deliberately, so until this lands the page is painted in the
      fallback stack and then reflowed. Shortening the swap window is the point.

      `crossorigin` is not optional even though the file is same-origin: font requests
      are made in CORS mode, and a preload without it is a second, separate download
      rather than a head start.

      Only DM Sans, and only the variable file. It is the one face certain to be needed
      on every page (all body text, at three weights from one file). DM Mono is
      deliberately not here -- it carries identifiers and SQL, which most first paints
      have none of, and preloading a face a page never uses spends bandwidth to save
      nothing.

      There is no `preconnect` or `dns-prefetch` anywhere in this file on purpose:
      every request this app makes -- /api/*, the fonts, the icons, the JS -- is
      same-origin, and Databricks Apps egress rules forbid the font CDN. A preconnect
      to an origin the browser is already connected to buys nothing.
    -->
    <link rel="preload" href="/fonts/DMSans-variable.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <title>Player Insights Agent</title>
    <script type="module" crossorigin src="/assets/index-Dez8cEb8.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/rolldown-runtime-DGruFWvd.js">
    <link rel="modulepreload" crossorigin href="/assets/appkit-ui-C_v6H0cL.js">
    <link rel="modulepreload" crossorigin href="/assets/organization-logos-CgURa7wh.js">
    <link rel="stylesheet" crossorigin href="/assets/index-CtpYCdnS.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
