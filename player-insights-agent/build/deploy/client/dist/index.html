<!doctype html>
<html
  lang="en"
  class="light"
  data-theme="light"
  data-background-graphics="on"
  data-animations="on"
  data-density="comfortable"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F7F9" />
    <script>
      /*
       * Server settings remain canonical. This same-origin cache only lets the
       * root adopt the last successful Appearance read before CSS paints.
       */
      try {
        const saved = JSON.parse(localStorage.getItem('astrolabe.runtime-appearance.v1') || 'null');
        const root = document.documentElement;
        const cachedScheme = saved?.colorScheme === 'dark' || saved?.colorScheme === 'light' ? saved.colorScheme : null;
        const colorScheme =
          cachedScheme || (window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        root.dataset.theme = colorScheme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', colorScheme === 'dark' ? '#0B1014' : '#F4F7F9');
        if (saved && typeof saved === 'object') {
          root.dataset.backgroundGraphics = saved.backgroundGraphics === false ? 'off' : 'on';
          root.dataset.animations = saved.animations === false ? 'off' : 'on';
          root.dataset.density = saved.density === 'compact' ? 'compact' : 'comfortable';
          const hex = /^#[0-9a-f]{6}$/i;
          const luminance = (value) => {
            const channels = [1, 3, 5]
              .map((at) => Number.parseInt(value.slice(at, at + 2), 16) / 255)
              .map((channel) => (channel <= 0.04045 ? channel / 12.92 : ((channel + 0.055) / 1.055) ** 2.4));
            return 0.2126 * channels[0] + 0.7152 * channels[1] + 0.0722 * channels[2];
          };
          const contrast = (foreground, background) => {
            if (!hex.test(foreground) || !hex.test(background)) return 0;
            const one = luminance(foreground);
            const two = luminance(background);
            return (Math.max(one, two) + 0.05) / (Math.min(one, two) + 0.05);
          };
          const surfaces = colorScheme === 'dark' ? ['#101820', '#0B1014'] : ['#FFFFFF', '#F4F7F9'];
          const readableOnSurfaces = (foreground) =>
            hex.test(foreground) && surfaces.every((background) => contrast(foreground, background) >= 4.5);
          if (readableOnSurfaces(saved.fontBodyColor)) {
            for (const token of [
              '--ast-text',
              '--ast-text-long',
              '--foreground',
              '--card-foreground',
              '--popover-foreground',
              '--secondary-foreground',
              '--accent-foreground',
              '--db-ink',
              '--db-body',
            ]) {
              root.style.setProperty(token, saved.fontBodyColor);
            }
          }
          const mutedColor =
            colorScheme === 'light' && saved.fontMutedColor?.toLowerCase() === '#6b7a87'
              ? '#62727F'
              : saved.fontMutedColor;
          if (readableOnSurfaces(mutedColor)) {
            for (const token of ['--ast-text-secondary', '--ast-caption', '--muted-foreground', '--db-slate']) {
              root.style.setProperty(token, mutedColor);
            }
          }
          const families = {
            'dm-sans': "'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif",
            system: "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif",
            'dm-mono': "'DM Mono', ui-monospace, SFMono-Regular, Menlo, monospace",
          };
          if (families[saved.fontFamily]) root.style.setProperty('--font-sans', families[saved.fontFamily]);
          const sizeScale = { s: 0.92, m: 1, l: 1.15 }[saved.fontSize];
          if (sizeScale) {
            for (const [token, px] of [
              ['--text-xs', 11],
              ['--text-sm', 12],
              ['--text-base', 13],
              ['--text-h-sub', 14],
              ['--text-h-section', 16],
              ['--text-h-card', 18],
              ['--text-h-page', 30],
              ['--text-kpi', 22],
              ['--text-hero', 40],
              ['--ast-fs-11', 11],
              ['--ast-fs-12', 12],
              ['--ast-fs-13', 13],
              ['--ast-fs-14', 14],
              ['--ast-fs-16', 16],
              ['--ast-fs-18', 18],
              ['--ast-fs-22', 22],
              ['--ast-fs-30', 30],
              ['--ast-fs-40', 40],
            ]) {
              root.style.setProperty(token, `${Math.round(px * sizeScale)}px`);
            }
          }
          const lightEntityDefaults = {
            catalog: { foreground: '#1A5B8F', background: '#E8F1FA' },
            schema: { foreground: '#4C5C68', background: '#EEF2F5' },
            table: { foreground: '#0E1720', background: '#E2E8ED' },
            column: { foreground: '#4C5C68', background: '#F2F5F8' },
            quote: { foreground: '#4C5C68', background: '#F2F5F8' },
            tag: { foreground: '#0E1720', background: '#E8F1FA' },
          };
          const darkEntityDefaults = {
            catalog: { foreground: '#A9B4FF', background: '#242A4E' },
            schema: { foreground: '#D7D2FF', background: '#372F66' },
            table: { foreground: '#F4F6FB', background: '#262A38' },
            column: { foreground: '#E8F2FA', background: '#1E2830' },
            quote: { foreground: '#B7D6EE', background: '#181E23' },
            tag: { foreground: '#F2F6FA', background: '#243746' },
          };
          const legacyLightEntityDefaults = {
            catalog: { foreground: '#7A5A11', background: '#FBF5E6' },
            schema: { foreground: '#7A5A11', background: '#FBF5E6' },
            table: { foreground: '#7A5A11', background: '#FBF5E6' },
            column: { foreground: '#4C5C68', background: '#F2F5F8' },
            quote: { foreground: '#4C5C68', background: '#F2F5F8' },
            tag: { foreground: '#0E1720', background: '#E8F1FA' },
          };
          const paperEntityDefaults = {
            catalog: { foreground: '#FFFFFF', background: '#0E538B' },
            schema: { foreground: '#16324F', background: '#DDEAF4' },
            table: { foreground: '#3A3838', background: '#E8E8E8' },
            column: { foreground: '#3A3838', background: '#F4F4F4' },
            quote: { foreground: '#46596B', background: '#F7F7F7' },
            tag: { foreground: '#FFFFFF', background: '#243746' },
          };
          for (const kind of ['catalog', 'schema', 'table', 'column', 'quote', 'tag']) {
            let style = saved.entityStyles?.[kind];
            const legacyLightDefault =
              ['catalog', 'schema', 'table'].includes(kind) &&
              style?.foreground?.toLowerCase() === '#7a5a11' &&
              style?.background?.toLowerCase() === '#fbf5e6';
            const darkDefault = darkEntityDefaults[kind];
            const currentDefaults = [
              lightEntityDefaults[kind],
              legacyLightEntityDefaults[kind],
              paperEntityDefaults[kind],
            ];
            const carriesDarkDefault =
              colorScheme === 'light' &&
              ((style?.foreground?.toLowerCase() === darkDefault.foreground.toLowerCase() &&
                currentDefaults.some(
                  (candidate) => style?.background?.toLowerCase() === candidate.background.toLowerCase()
                )) ||
                (style?.background?.toLowerCase() === darkDefault.background.toLowerCase() &&
                  currentDefaults.some(
                    (candidate) => style?.foreground?.toLowerCase() === candidate.foreground.toLowerCase()
                  )));
            if (colorScheme === 'light' && (legacyLightDefault || carriesDarkDefault)) {
              style = lightEntityDefaults[kind];
            }
            if (
              hex.test(style?.foreground) &&
              hex.test(style?.background) &&
              contrast(style.foreground, style.background) >= 4.5
            ) {
              root.style.setProperty(`--entity-${kind}-fg`, style.foreground);
              root.style.setProperty(`--entity-${kind}-bg`, style.background);
            }
          }
        }
      } catch {
        if (window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#0B1014');
        }
      }
    </script>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }
      body {
        margin: 0;
        background: #f4f7f9;
      }
      html[data-theme='dark'] body {
        background: #0b1014;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/pia-dpad-tab.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/pia-dpad-tab-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/pia-dpad-tab-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/pia-dpad-tab-48x48.png" />
    <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="/pia-dpad-apple-touch-180x180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--
      The body typeface, asked for before the stylesheet that names it has arrived.

      A font is otherwise the LAST thing discovered on a cold load: the browser has to
      fetch the entry script, then the stylesheet it imports, then parse the @font-face
      in styles/fonts.css, and only then does it learn this file exists. Starting it here
      collapses that chain, which is worth more than it looks -- fonts.css sets
      `font-display: swap` deliberately, so until this lands the page is painted in the
      fallback stack and then reflowed. Shortening the swap window is the point.

      `crossorigin` is not optional even though the file is same-origin: font requests
      are made in CORS mode, and a preload without it is a second, separate download
      rather than a head start.

      Only DM Sans, and only the variable file. It is the one face certain to be needed
      on every page (all body text, at three weights from one file). DM Mono is
      deliberately not here -- it carries identifiers and SQL, which most first paints
      have none of, and preloading a face a page never uses spends bandwidth to save
      nothing.

      There is no `preconnect` or `dns-prefetch` anywhere in this file on purpose:
      every request this app makes -- /api/*, the fonts, the icons, the JS -- is
      same-origin, and Databricks Apps egress rules forbid the font CDN. A preconnect
      to an origin the browser is already connected to buys nothing.
    -->
    <link rel="preload" href="/fonts/DMSans-variable.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <title>Player Insights Agent</title>
    <script type="module" crossorigin src="/assets/index-qftMsWUO.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/rolldown-runtime-DGruFWvd.js">
    <link rel="modulepreload" crossorigin href="/assets/appkit-ui-CRLojMPe.js">
    <link rel="modulepreload" crossorigin href="/assets/organization-logos-BDKSbedR.js">
    <link rel="stylesheet" crossorigin href="/assets/index-BwFHbXhT.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
