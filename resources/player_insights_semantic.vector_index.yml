# Optional semantic metadata index. Empty resource maps create no Vector Search
# endpoint or index. See README.md for opt-in variables and deployment order.

variables:
  semantic_index_endpoint:
    description: >-
      Name of the AI Search endpoint that serves the semantic-layer index.
      Leave empty to disable semantic retrieval. When enabling it, also set
      semantic_index_endpoints and semantic_index_indexes.
    default: ""
  semantic_index_endpoint_type:
    description: >-
      STANDARD or STORAGE_OPTIMIZED endpoint type.
    default: STANDARD
  semantic_embedding_endpoint:
    description: >-
      Foundation-model endpoint used to embed semantic metadata.
    default: databricks-gte-large-en
  semantic_index_pipeline_type:
    description: >-
      TRIGGERED or CONTINUOUS Delta Sync pipeline type.
    default: TRIGGERED
  semantic_index_endpoints:
    type: complex
    description: >-
      Optional vector_search_endpoints resource map. Empty creates no endpoint.
    default: {}
  semantic_index_indexes:
    type: complex
    description: >-
      Optional vector_search_indexes resource map. Build
      ${var.app_catalog}.${var.app_schema}.semantic_layer_entries before
      creating a DELTA_SYNC index.
    default: {}
  semantic_rebuild_schedule:
    description: >-
      Quartz cron for semantic metadata refreshes. The rebuild job under this
      target is deployed PAUSED; review its identity and first run before
      unpausing it.
    default: "0 0 7 * * ?"

# Do not add a targets: block here. Opt in by filling the variables above in
# variable-overrides.json; empty defaults create no endpoint and no index.
resources:
  vector_search_endpoints: ${var.semantic_index_endpoints}
  vector_search_indexes: ${var.semantic_index_indexes}
