# The Databricks App.
# Configures the app, OAuth scopes, source path, and resource attachments.
# The app source tree and serving endpoint are deployed separately.
#
# The Lakebase instance and the two Genie spaces are NOT created here. Provision
# the Lakebase project/branch/database and curate the Genie spaces first, then
# name them with lakebase_project_id, genie_data_space_id and
# genie_dictionary_space_id. The `postgres` binding below attaches this app to
# that existing database; it does not create one.
#
# On a fresh workspace, deploy backing resources before the app:
#
#   pass 0  provision Lakebase and the Genie spaces outside the bundle
#   pass 1  bundle deploy -t <target> --select schemas.player_insights_schema \
#                                     --select schemas.player_insights_telemetry_schema \
#                                     --select volumes.player_insights_volume \
#                                     --select experiments.player_insights_experiment \
#                                     --select jobs.player_insights_semantic_rebuild
#           everything except this app
#   ...    project your tables onto the data contract, then run
#          bundle/agent-release.sh to create the serving endpoint
#   pass 2  bundle deploy -t <target>
#           creates the app
#
# source_code_path must be an absolute workspace path and must not contain
# package.json, which would trigger `npm install` during app deployment.

variables:
  app_telemetry_schema:
    description: >-
      Separate schema inside ${var.app_catalog} for OpenTelemetry tables.
      The bundle creates it, but ingestion stays off while
      app_telemetry_destinations is empty. Keep telemetry outside
      ${var.app_schema}.
    default: player_insights_telemetry
  app_telemetry_destinations:
    description: >-
      OpenTelemetry export destinations. Defaults to an empty list, which
      disables telemetry and ingestion charges. Set this only with
      app_telemetry_schema after approving the billed ingestion. Tables do not
      backfill and begin receiving data after the app is redeployed.
    type: complex
    default: []

resources:
  apps:
    player_insights_app:
      name: ${var.app_name}
      description: ${var.app_description}
      source_code_path: ${var.app_source_code_path}

      # Optional OpenTelemetry destinations. Empty disables telemetry.
      # This feature is region-limited and can create ingestion charges.
      telemetry_export_destinations: ${var.app_telemetry_destinations}

      # OAuth scopes for the signed-in user's forwarded token. Keep this list
      # minimal: one unavailable required scope can block sign-in. Catalog
      # *:read scopes are optional for the login gate; Vector Search scopes are
      # required when a semantic index is deployed. Scope changes need a full
      # app stop/start and a fresh sign-in.
      user_api_scopes: ${var.app_user_api_scopes}

      # These bindings grant the app service principal access to its state
      # store, serving endpoint, and SQL warehouse. Do not bind governed tables
      # or Genie spaces; governed reads must use the signed-in user's token.
      resources:
        # Attaches the app to an EXISTING Lakebase branch and database, named by
        # full resource name. This binding is the whole of what the bundle
        # declares about Lakebase: it grants the app's service principal
        # CAN_CONNECT_AND_CREATE, and creates nothing. CAN_CONNECT_AND_CREATE is
        # what lets the app create and own its own schema inside that database;
        # the Postgres-level grants on that schema are applied by
        # bundle/app-db-grant.sh before every app code deploy (and by its
        # underlying scripts/grant-app-db-access.mjs), because privileges inside
        # a database are out of the control plane's reach.
        - name: postgres
          postgres:
            branch: ${var.postgres_branch_name}
            database: ${var.postgres_database_name}
            permission: CAN_CONNECT_AND_CREATE
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY
        # This binding supplies the warehouse ID and grants app access.
        # CAN_USE, not CAN_MANAGE: the app only runs queries on this warehouse,
        # and a deployer who does not already hold MANAGE on it cannot grant
        # MANAGE away, so asking for it fails the deploy in any workspace where
        # the warehouse belongs to someone else.
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE

      lifecycle:
        # Destroying the app also removes its service principal and grants.
        prevent_destroy: true
